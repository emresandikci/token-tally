name: Bug report
description: Report a reproducible bug in token-tally
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal, reproducible steps.
      placeholder: |
        1. Run command ...
        2. Use model ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: token-tally version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Bun or Node version
      placeholder: e.g. Bun 1.3.13 / Node 20.18.0

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      render: shell
